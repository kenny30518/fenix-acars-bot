name: Fenix ACARS Dispatcher
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run ACARS Bot
        env:
          SIMBRIEF_USER: ${{ secrets.SIMBRIEF_USER }}
          HOPPIE_LOGON: ${{ secrets.HOPPIE_LOGON }}
        run: python main.py
      - name: Save Flight State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add flight_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update flight state" && git push)
