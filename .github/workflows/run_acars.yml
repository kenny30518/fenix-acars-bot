```yaml
   name: Fenix ACARS Dispatcher
   on:
     schedule:
       - cron: '*/5 * * * *'
     workflow_dispatch:

   jobs:
     run-script:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: '3.10'
         - run: pip install -r requirements.txt
         - name: Run ACARS Bot
           env:
             SIMBRIEF_USER: ${{ secrets.SIMBRIEF_USER }}
             HOPPIE_LOGON: ${{ secrets.HOPPIE_LOGON }}
           run: python main.py
